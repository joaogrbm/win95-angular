@if (dialog.current(); as open) {
  <!-- @for com track pela própria pergunta recria o diálogo a cada nova pergunta,
       mesmo quando uma abre logo depois da outra (assim o campo volta a ser focado e selecionado) -->
  @for (current of [open]; track current) {
  <div class="dialog-backdrop" (mousedown)="$event.stopPropagation()" (click)="$event.stopPropagation()" (contextmenu)="$event.preventDefault(); $event.stopPropagation()">
    <div class="dialog" role="alertdialog" [attr.aria-label]="current.title">
      <div class="dialog-title-bar">
        <span>{{ current.title }}</span>
        <button aria-label="Fechar" (click)="dialog.answer(null)">✖</button>
      </div>
      <div class="dialog-body">
        @if (current.icon) {
          <span class="dialog-icon">{{ icons[current.icon] }}</span>
        }
        <div class="dialog-text">
          <p>{{ current.message }}</p>
          @if (current.input !== undefined) {
            <input #dialogInput
                   type="text"
                   [value]="dialog.inputValue()"
                   (input)="dialog.inputValue.set($any($event.target).value)"
                   (keydown.enter)="dialog.answer(current.buttons[0])">
          }
        </div>
      </div>
      <div class="dialog-buttons">
        @for (label of current.buttons; track label) {
          <button #dialogButton (click)="dialog.answer(label)">{{ label }}</button>
        }
      </div>
    </div>
  </div>
  }
}
