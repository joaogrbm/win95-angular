<div class="my-computer">
  <div class="drive-area" (click)="selectedLetter.set(null)">
    @for (drive of drives; track drive.letter) {
      <div class="drive"
           [class.selected]="selectedLetter() === drive.letter"
           (click)="selectedLetter.set(drive.letter); $event.stopPropagation()"
           (dblclick)="open(drive)">
        @switch (drive.kind) {
          @case ('floppy') {
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect x="5" y="4" width="22" height="24" fill="#000080" stroke="#000" />
              <rect x="10" y="4" width="12" height="9" fill="#c0c0c0" stroke="#000" />
              <rect x="17" y="6" width="3" height="5" fill="#000080" />
              <rect x="8" y="17" width="16" height="10" fill="#fff" stroke="#000" />
              <line x1="10" y1="20" x2="22" y2="20" stroke="#808080" />
              <line x1="10" y1="23" x2="22" y2="23" stroke="#808080" />
            </svg>
          }
          @case ('disk') {
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <polygon points="4,14 10,9 30,9 24,14" fill="#dfdfdf" stroke="#000" />
              <polygon points="24,14 30,9 30,18 24,23" fill="#808080" stroke="#000" />
              <rect x="4" y="14" width="20" height="9" fill="#c0c0c0" stroke="#000" />
              <rect x="6" y="18" width="10" height="2" fill="#808080" />
              <rect x="19" y="18" width="3" height="2" fill="#00ff00" />
            </svg>
          }
          @case ('cdrom') {
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="10" r="8" fill="#e0e0ff" stroke="#000" />
              <circle cx="16" cy="10" r="8" fill="none" stroke="#ff80ff" stroke-width="2" stroke-dasharray="5 7" />
              <circle cx="16" cy="10" r="2" fill="#fff" stroke="#000" />
              <polygon points="4,20 10,16 30,16 24,20" fill="#dfdfdf" stroke="#000" />
              <polygon points="24,20 30,16 30,24 24,28" fill="#808080" stroke="#000" />
              <rect x="4" y="20" width="20" height="8" fill="#c0c0c0" stroke="#000" />
              <rect x="7" y="23" width="12" height="2" fill="#808080" />
            </svg>
          }
        }
        <span>{{ drive.label }}</span>
      </div>
    }
  </div>

  <div class="status-bar">{{ statusText() }}</div>
</div>
